name: Release

# Pushing a tag such as v1.0.0 builds the distributable archive and publishes
# it as an asset of the matching GitHub Release. The archive is never
# committed to the repository.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish, for example v1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release archive
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the tag
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - name: Check that the tag and the three version numbers agree
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e
          header=$( grep -oP '^ \* Version:\s+\K.+' sf-image-resizer/sf-image-resizer.php | tr -d '[:space:]' )
          constant=$( grep -oP "define\( 'SFIR_VERSION', '\K[^']+" sf-image-resizer/sf-image-resizer.php )
          stable=$( grep -oP '^Stable tag:\s+\K.+' sf-image-resizer/readme.txt | tr -d '[:space:]' )

          echo "tag=$VERSION header=$header constant=$constant stable_tag=$stable"

          for value in "$header" "$constant" "$stable"; do
            if [ "$value" != "$VERSION" ]; then
              echo "::error::Version mismatch. The tag says $VERSION but the plugin says header=$header constant=$constant stable_tag=$stable."
              exit 1
            fi
          done

          if ! grep -q "^= ${VERSION} =$" sf-image-resizer/readme.txt; then
            echo "::error::readme.txt has no changelog entry for ${VERSION}."
            exit 1
          fi

      - name: Build the archive
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e
          zip -r -q "SFimageResizer-${VERSION}.zip" sf-image-resizer \
              -x '*.DS_Store' -x '__MACOSX/*' -x '*/.git/*'
          ls -l "SFimageResizer-${VERSION}.zip"

      - name: Verify the archive
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e
          ARCHIVE="SFimageResizer-${VERSION}.zip"

          unzip -t "$ARCHIVE" > /dev/null
          unzip -l "$ARCHIVE"

          top=$( unzip -Z1 "$ARCHIVE" | awk -F/ '{print $1}' | sort -u )
          if [ "$top" != "sf-image-resizer" ]; then
            echo "::error::The archive must contain exactly one top level directory, sf-image-resizer. Found: $top"
            exit 1
          fi

          if unzip -Z1 "$ARCHIVE" | grep -E '(^|/)(tests|node_modules|vendor)/|composer\.(json|lock)|(^|/)\.[^/]+$'; then
            echo "::error::The archive contains development files that must not ship."
            exit 1
          fi

          echo "sha256: $( sha256sum "$ARCHIVE" | cut -d' ' -f1 )"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          set -e
          ARCHIVE="SFimageResizer-${VERSION}.zip"
          SHA=$( sha256sum "$ARCHIVE" | cut -d' ' -f1 )

          {
            echo "Installable archive of SFimageResizer ${VERSION}."
            echo
            echo "Upload \`${ARCHIVE}\` on **Plugins → Add New → Upload Plugin**, or install it with WP-CLI:"
            echo
            echo '```'
            echo "wp plugin install ${ARCHIVE} --activate"
            echo '```'
            echo
            echo "\`sha256: ${SHA}\`"
            echo
            echo "See \`sf-image-resizer/readme.txt\` for the changelog."
          } > release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SFimageResizer ${VERSION}" \
              --notes-file release-notes.md
          fi
