name: Release

# Two ways to publish, both ending in the same place:
#
#   * push a tag such as v1.2.0;
#   * or run this workflow by hand from the Actions tab: pick the branch,
#     type the version, and the tag is created for you.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, with or without the leading v, for example 1.2.0. The tag is created on the branch selected above.'
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build and publish the release archive
    runs-on: ubuntu-latest

    steps:
      - name: Resolve the version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          set -e

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="${INPUT_VERSION#v}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG#v}"
          fi

          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::\"$VERSION\" is not a version number of the form 1.2.3."
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          # A tag push checks out the tag; a manual run checks out the branch
          # the run was started from, and the tag is created from it below.
          fetch-depth: 0

      - name: Check that the version numbers agree
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          header=$( grep -oP '^ \* Version:\s+\K.+' sf-image-resizer/sf-image-resizer.php | tr -d '[:space:]' )
          constant=$( grep -oP "define\( 'SFIR_VERSION', '\K[^']+" sf-image-resizer/sf-image-resizer.php )
          stable=$( grep -oP '^Stable tag:\s+\K.+' sf-image-resizer/readme.txt | tr -d '[:space:]' )

          echo "requested=$VERSION header=$header constant=$constant stable_tag=$stable"

          for value in "$header" "$constant" "$stable"; do
            if [ "$value" != "$VERSION" ]; then
              echo "::error::Version mismatch. The release says $VERSION but the plugin says header=$header constant=$constant stable_tag=$stable."
              exit 1
            fi
          done

          if ! grep -q "^= ${VERSION} =$" sf-image-resizer/readme.txt; then
            echo "::error::readme.txt has no changelog entry for ${VERSION}."
            exit 1
          fi

      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -e

          if git rev-parse "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists, reusing it."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "SF Image resizer ${{ steps.version.outputs.version }}"
          git push origin "$TAG"

      - name: Build the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          zip -r -q "SFimageResizer-${VERSION}.zip" sf-image-resizer \
              -x '*.DS_Store' -x '__MACOSX/*' -x '*/.git/*'
          ls -l "SFimageResizer-${VERSION}.zip"

      - name: Verify the archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          ARCHIVE="SFimageResizer-${VERSION}.zip"

          unzip -t "$ARCHIVE" > /dev/null
          unzip -l "$ARCHIVE"

          top=$( unzip -Z1 "$ARCHIVE" | awk -F/ '{print $1}' | sort -u )
          if [ "$top" != "sf-image-resizer" ]; then
            echo "::error::The archive must contain exactly one top level directory, sf-image-resizer. Found: $top"
            exit 1
          fi

          if unzip -Z1 "$ARCHIVE" | grep -E '(^|/)(tests|node_modules|vendor)/|composer\.(json|lock)|(^|/)\.[^/]+$'; then
            echo "::error::The archive contains development files that must not ship."
            exit 1
          fi

          echo "sha256: $( sha256sum "$ARCHIVE" | cut -d' ' -f1 )"

      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -e
          ARCHIVE="SFimageResizer-${VERSION}.zip"
          SHA=$( sha256sum "$ARCHIVE" | cut -d' ' -f1 )

          {
            echo "Installable archive of SF Image resizer ${VERSION}."
            echo
            echo "Upload \`${ARCHIVE}\` on **Plugins → Add New → Upload Plugin**, or install it with WP-CLI:"
            echo
            echo '```'
            echo "wp plugin install ${ARCHIVE} --activate"
            echo '```'
            echo
            echo "\`sha256: ${SHA}\`"
            echo
            echo "See \`sf-image-resizer/readme.txt\` for the changelog."
          } > release-notes.md

          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$ARCHIVE" --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$TAG" "$ARCHIVE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "SF Image resizer ${VERSION}" \
              --notes-file release-notes.md
          fi
