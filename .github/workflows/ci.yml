name: CI

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests and coding standards (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lowest version the plugin supports and a current one.
        php: ['7.4', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: gd, exif, mbstring
          coverage: none

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Unit tests (spec 11.1)
        run: vendor/bin/phpunit

      - name: WordPress Coding Standards
        run: vendor/bin/phpcs --standard=phpcs.xml.dist

  integration:
    name: WordPress integration suite and Plugin Check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      SFIR_WP_DIR: ${{ github.workspace }}/wp
      SFIR_BASE_URL: http://127.0.0.1:8899
      SFIR_ADMIN_USER: admin
      SFIR_ADMIN_PASS: admin123

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin-src

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: gd, exif, mysqli, mbstring, curl, zip
          ini-values: memory_limit=512M
          coverage: none

      - name: Install WP-CLI
        run: |
          curl -sSL -o wp-cli.phar https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp
          wp --info

      - name: Install WordPress
        run: |
          mkdir -p "$SFIR_WP_DIR"
          cd "$SFIR_WP_DIR"
          wp core download --version=latest
          wp config create \
            --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1:3306 \
            --extra-php <<'PHP'
          define( 'WP_DEBUG', true );
          define( 'WP_DEBUG_LOG', true );
          define( 'WP_DEBUG_DISPLAY', false );
          PHP
          wp core install \
            --url="$SFIR_BASE_URL" --title="SFIR CI" \
            --admin_user="$SFIR_ADMIN_USER" --admin_password="$SFIR_ADMIN_PASS" \
            --admin_email=ci@example.com --skip-email
          wp rewrite structure '/%postname%/'

      - name: Install the plugin under test
        run: |
          # Copied, never symlinked: a symlinked plugin directory changes how
          # plugin_dir_url() resolves and would not match a real installation.
          cp -r "${{ github.workspace }}/plugin-src/sf-image-resizer" \
                "$SFIR_WP_DIR/wp-content/plugins/sf-image-resizer"
          cd "$SFIR_WP_DIR"
          wp plugin activate sf-image-resizer
          wp plugin install plugin-check --activate

      - name: Start the web server
        run: |
          php -S 127.0.0.1:8899 -t "$SFIR_WP_DIR" \
              "${{ github.workspace }}/plugin-src/tests/integration/router.php" \
              > "${{ runner.temp }}/server.log" 2>&1 &
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null "$SFIR_BASE_URL/"; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server did not start"; cat "${{ runner.temp }}/server.log"; exit 1

      - name: Integration suite (spec 11.2.1 - 11.2.11)
        working-directory: ${{ env.SFIR_WP_DIR }}
        run: wp eval-file "${{ github.workspace }}/plugin-src/tests/integration/run.php"

      - name: Admin screen (spec 11.2.10)
        working-directory: ${{ env.SFIR_WP_DIR }}
        run: wp eval-file "${{ github.workspace }}/plugin-src/tests/integration/admin.php"

      - name: WebP fallback (spec 11.2.12)
        working-directory: ${{ env.SFIR_WP_DIR }}
        run: php -d disable_functions=imagewebp "$(command -v wp)" eval-file "${{ github.workspace }}/plugin-src/tests/integration/webp-fallback.php"

      - name: Activation, deactivation and uninstall (spec 11.2.13)
        working-directory: ${{ env.SFIR_WP_DIR }}
        run: wp eval-file "${{ github.workspace }}/plugin-src/tests/integration/lifecycle.php"

      - name: Plugin Check (spec 11.3)
        working-directory: ${{ env.SFIR_WP_DIR }}
        run: |
          wp plugin check sf-image-resizer \
            --categories=general,plugin_repo,security,performance,accessibility \
            --include-experimental

      - name: Server log on failure
        if: failure()
        run: cat "${{ runner.temp }}/server.log" || true
